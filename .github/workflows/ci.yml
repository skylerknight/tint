name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 is EOL, and the vite-playground build cannot run there:
        # @tailwindcss/oxide >=4.2 (engines.node >=20) skips its native
        # binding, so `vite build` throws "Cannot find native binding".
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
